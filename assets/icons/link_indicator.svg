<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" overflow="visible">
  <defs>
    <clipPath id="top-half" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="100" height="50" />
    </clipPath>
    <clipPath id="bottom-half" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="50" width="100" height="50" />
    </clipPath>
    <mask
      id="mask-right"
      maskUnits="userSpaceOnUse"
      maskContentUnits="userSpaceOnUse"
      x="0" y="0" width="100" height="100"
    >
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <rect
        x="10" y="30" width="48" height="40" rx="14"
        fill="none"
        stroke="black"
        stroke-width="18"
        clip-path="url(#top-half)"
      />
    </mask>
    <mask
      id="mask-left"
      maskUnits="userSpaceOnUse"
      maskContentUnits="userSpaceOnUse"
      x="0" y="0" width="100" height="100"
    >
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <rect
        x="42" y="30" width="48" height="40" rx="14"
        fill="none"
        stroke="black"
        stroke-width="18"
        clip-path="url(#bottom-half)"
      />
    </mask>
  </defs>
  <rect
    x="42" y="30" width="48" height="40" rx="14"
    fill="none"
    stroke="#2563eb"
    stroke-width="10"
    mask="url(#mask-right)"
  />
  <rect
    x="10" y="30" width="48" height="40" rx="14"
    fill="none"
    stroke="#2563eb"
    stroke-width="10"
    mask="url(#mask-left)"
  />
</svg>
